<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 420px; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 78% 40%, #2b6cf6 0%, #1b4fd1 45%, #10265f 100%);
    color: #fff; position: relative; }
  .glow { position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,170,255,.35), transparent 62%);
    right: -80px; top: -120px; }
  .grid { position: absolute; inset: 0; opacity: .16;
    background-image: linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
    background-size: 46px 46px; }
  .left { position: relative; padding: 62px 0 0 72px; width: 720px; }
  .logo { width: 62px; height: 62px; border-radius: 18px; background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700;
    backdrop-filter: blur(6px); margin-bottom: 22px; }
  h1 { font-size: 46px; letter-spacing: .5px; font-weight: 800; }
  h1 span { color: #a8c6ff; font-weight: 500; font-size: 26px; margin-left: 10px; }
  .sub { margin-top: 14px; font-size: 19px; color: rgba(255,255,255,.86); line-height: 1.6; }
  .tags { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 14px; padding: 7px 14px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }
  .right { position: absolute; right: 58px; top: 44px; width: 300px; height: 340px;
    border-radius: 26px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.42);
    border: 1px solid rgba(255,255,255,.3); transform: rotate(-2.2deg); background: #fff; }
  .right img { width: 100%; display: block; margin-top: -430px; }
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="left">
    <div class="logo">退</div>
    <h1>RetCard<span>退货地址制卡</span></h1>
    <div class="sub">粘贴退货信息 · 自动识别姓名/电话/地址<br>一键生成淘宝 / 抖音 / 小红书 / 拼多多退货卡图</div>
    <div class="tags">
      <div class="tag">4 套平台模板</div>
      <div class="tag">纯离线 · 零网络请求</div>
      <div class="tag">无广告 · 无内购</div>
      <div class="tag">0.75 MB APK</div>
    </div>
  </div>
  <div class="right"><img src="screens/02-result.png"></div>
</body></html>
