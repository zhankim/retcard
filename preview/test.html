<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>渲染自检</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background:#eef1f6; margin:0; padding:16px; }
  h3 { margin: 4px 0 8px; font-size: 14px; color:#333; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .item { width: 300px; }
  canvas { width: 300px; height: auto; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.12); background:#fff; }
  #parsed { font-size: 12px; color:#555; background:#fff; padding:8px 12px; border-radius:8px; margin-bottom:12px; }
</style>
</head>
<body>
<div id="parsed">parsing…</div>
<div class="row" id="out"></div>
<script src="../app/assets/www/images.js"></script>
<script src="../app/assets/www/templates.js"></script>
<script src="../app/assets/www/app.js"></script>
<script>
  var SAMPLE = "收货人：张三\n电话：13800138000\n地址：浙江省杭州市余杭区文一西路969号2幢301室";
  window.addEventListener("load", function () {
    var api = window.__retcard;
    var parsed = api.parseAddressText(SAMPLE);
    document.getElementById("parsed").textContent =
      "解析结果 → 姓名:" + parsed.name + "  电话:" + parsed.phone + "  地址:" + parsed.address;
    var out = document.getElementById("out");
    ["tb", "dy", "xhs", "pdd"].forEach(function (key) {
      var cfg = api.TEMPLATE_CONFIGS[key];
      var wrap = document.createElement("div");
      wrap.className = "item";
      wrap.innerHTML = "<h3>" + key + " · " + cfg.alias + " · " + cfg.canvasWidth + "x" + cfg.canvasHeight + "</h3>";
      var c = document.createElement("canvas");
      wrap.appendChild(c);
      out.appendChild(wrap);
      api.renderCard(c, cfg, parsed).catch(function (e) {
        wrap.innerHTML += "<div style='color:#c00;font-size:12px'>" + e.message + "</div>";
      });
    });
  });
</script>
</body>
</html>
