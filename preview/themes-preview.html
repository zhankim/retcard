<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>themes preview</title>
<style>body{margin:0;padding:16px;background:#f0f2f5;font-family:"Microsoft YaHei",sans-serif}
.row{display:flex;gap:16px}.item{width:360px}canvas{width:360px;height:480px;display:block;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
h4{margin:0 0 8px;font-size:13px;color:#444}</style></head><body>
<div class="row" id="out"></div>
<script src="../app/assets/www/themes.js"></script>
<script>
var data={name:"张三",phone:"13800138000",address:"浙江省杭州市余杭区文一西路969号2幢301室",days:7};
window.addEventListener("load",function(){
  var out=document.getElementById("out");
  Object.keys(window.THEMES).forEach(function(k){
    var t=window.THEMES[k];
    var box=document.createElement("div"); box.className="item";
    box.innerHTML="<h4>"+k+" · "+t.name+" · "+t.W+"x"+t.H+"</h4>";
    var c=document.createElement("canvas"); c.width=t.W; c.height=t.H;
    box.appendChild(c); out.appendChild(box);
    t.draw(c.getContext("2d"), t.W, t.H, data);
  });
});
</script></body></html>
