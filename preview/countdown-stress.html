<!DOCTYPE html><html><head><meta charset="utf-8"><title>stress</title></head>
<body><div id="res">running</div>
<script src="../app/assets/www/images.js"></script>
<script src="../app/assets/www/templates.js"></script>
<script src="../app/assets/www/app.js"></script>
<script>
window.addEventListener("load", function(){
  var api = window.__retcard;
  var form = {name:"张三", phone:"13800138000", address:"浙江省杭州市余杭区文一西路969号2幢301室"};
  var keys = Object.keys(api.TEMPLATE_CONFIGS);
  var ok=0, fail=0, msgs=[];
  var jobs = [];
  keys.forEach(function(k){ for(var i=0;i<60;i++) jobs.push(k); });
  function step(idx){
    if(idx>=jobs.length){
      var s = "STRESS ok="+ok+" fail="+fail+(msgs.length?(" :: "+msgs.slice(0,3).join(" | ")):"");
      document.getElementById("res").textContent = s;
      document.title = s;
      return;
    }
    var k=jobs[idx];
    var c=document.createElement("canvas");
    api.renderCard(c, api.TEMPLATE_CONFIGS[k], form).then(function(){ ok++; step(idx+1); })
      .catch(function(e){ fail++; if(msgs.length<3) msgs.push(k+": "+e.message); step(idx+1); });
  }
  step(0);
});
</script></body></html>
